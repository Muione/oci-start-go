version: "2"
sql:
  - engine: "sqlite"
    queries:
      - internal/repo/queries/system.sql
      - internal/repo/queries/auth.sql
      - internal/repo/queries/session.sql
      - internal/repo/queries/system_config.sql
      - internal/repo/queries/ban.sql
      - internal/repo/queries/tenant.sql
      - internal/repo/queries/instance_detail.sql
      - internal/repo/queries/vpn_proxy_record.sql
      - internal/repo/queries/grabber.sql
      - internal/repo/queries/instance_detail_ext.sql
      - internal/repo/queries/tenant_email_config.sql
      - internal/repo/queries/tenant_social.sql
      - internal/repo/queries/cloud_tenancy.sql
      - internal/repo/queries/tenant_ext.sql
      - internal/repo/queries/register_detail.sql
      - internal/repo/queries/multipart_upload.sql
      - internal/repo/queries/email_receive.sql
      - internal/repo/queries/email_body.sql
      - internal/repo/queries/email_send_record.sql
      - internal/repo/queries/tenant_email_config_ext.sql
      - internal/repo/queries/shape_cache.sql
      - internal/repo/queries/image_cache.sql
    schema:
      - migrations/0001_init_schema.up.sql
      - migrations/0002_auth.up.sql
      - migrations/0003_tenant_key.up.sql
      - migrations/0004_dns_cache.up.sql
      - migrations/0005_multipart_upload.up.sql
      - migrations/0007_console_connection_timestamp.up.sql
      - migrations/0008_shape_image_cache.up.sql
      - migrations/0011_subscription_fields.up.sql
    gen:
      go:
        package: "repo"
        out: "internal/repo"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
